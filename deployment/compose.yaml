services:
  ollama:
    image: ollama/ollama:0.35.0
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "131072"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [ai_backend]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OLLAMA_API: "true"
      ENABLE_OPENAI_API: "false"
      OFFLINE_MODE: "true"
      WEBUI_AUTH: "true"
      ENABLE_PASSWORD_AUTH: "true"
      DEFAULT_USER_ROLE: pending
      WEBUI_URL: https://ai.corp.example
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in Portainer stack environment variables}
      LDAP_CA_CERT_FILE: /certs/corp-ca.pem
    volumes:
      - webui_data:/app/backend/data
      - /opt/ai-redteam/certs:/certs:ro
    networks: [ai_backend]

volumes:
  ollama_data:
    name: air_ollama_data
  webui_data:
    name: air_webui_data

networks:
  ai_backend:
    driver: bridge
